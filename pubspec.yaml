name: pokeiring
description: "A gamified cat discovery and exploration app combining on-device AI classification with GPS mapping."
publish_to: 'none'

version: 0.18.0+24

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.2
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.2.3
  permission_handler: ^12.0.0
  pedometer: ^4.2.0
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.4
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/music/
