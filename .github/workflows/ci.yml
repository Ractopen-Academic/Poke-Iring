name: Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  analyze-and-test:
    name: Lint, Analyze, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/build.gradle.kts', 'android/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: |
          if [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            flutter test --coverage
          else
            echo "No test files found, skipping test suite."
          fi

      - name: Configure Mock Google Services for CI
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"pokeiring-ci","storage_bucket":"pokeiring-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.ryme.pokeiring"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Build Android APK (Debug Smoke Test)
        run: flutter build apk --debug
