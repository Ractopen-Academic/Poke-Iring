name: Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  analyze-and-test:
    name: Lint, Analyze, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: |
          if [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            flutter test --coverage
          else
            echo "No test files found, skipping test suite."
          fi

      - name: Configure Mock Google Services for CI
        run: |
          if [ ! -f android/app/google-services.json ]; then
            cat << 'EOF' > android/app/google-services.json
            {
              "project_info": {
                "project_number": "000000000000",
                "project_id": "pokeiring-ci-mock",
                "storage_bucket": "pokeiring-ci-mock.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                    "android_client_info": {
                      "package_name": "com.ryme.pokeiring"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyMockKeyForContinuousIntegration00"
                    }
                  ],
                  "services": {
                    "analytics_service": {
                      "status": 1
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Build Android APK (Debug Smoke Test)
        run: flutter build apk --debug
